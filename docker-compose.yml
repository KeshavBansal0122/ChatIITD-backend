services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
      args:
        # ldap_exports/ is gitignored — build seeds catalog always; enrollments
        # only when that directory is present on the build machine.
        SEED_ACTIVATE: ${SEED_ACTIVATE:-2601}
        SEED_SKIP_ENROLLMENTS: ${SEED_SKIP_ENROLLMENTS:-0}
        SEED_REQUIRE_ENROLLMENTS: ${SEED_REQUIRE_ENROLLMENTS:-0}
    image: chatiitd-postgres:seeded
    restart: unless-stopped
    environment:
      POSTGRES_USER: chatiitd
      POSTGRES_PASSWORD: chatiitd_dev
      POSTGRES_DB: chatiitd
    ports:
      - "5432:5432"
    volumes:
      # First start loads /docker-entrypoint-initdb.d seed dump.
      # Re-seed after rebuild: docker compose down -v && docker compose up -d --build
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatiitd -d chatiitd"]
      interval: 5s
      timeout: 5s
      retries: 12
      # First boot applies ~28MB seed SQL from the image
      start_period: 90s

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-storage:/qdrant/storage
    # Official image has no wget/curl — probe the TCP port with bash
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  qdrant-init:
    image: python:3.11-slim
    volumes:
      - ./snapshots:/snapshots
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
    depends_on:
      qdrant:
        condition: service_healthy
    command: >
      sh -c "pip install --quiet requests && python /snapshots/restore.py"
    restart: on-failure

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://chatiitd:chatiitd_dev@postgres:5432/chatiitd
      QDRANT_URL: http://qdrant:6333
      # Comma-separated origins OK. Defaults cover Vite (:5173) and Docker frontend (:3000).
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173,http://localhost:3000}
      # Public URL as seen by clients (include /backend when using the nginx path prefix)
      BACKEND_URL: ${BACKEND_URL:-http://35.154.241.94/backend}
      ROOT_PATH: ${ROOT_PATH:-/backend}
    command:
      - uvicorn
      - backend.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --proxy-headers
      - --root-path
      - ${ROOT_PATH:-/backend}
    ports:
      - "8000:8000"
    volumes:
      - backend-uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      qdrant-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres-data:
  qdrant-storage:
  backend-uploads:
